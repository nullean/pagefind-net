<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pagefind-net search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #1a1a1a;
      line-height: 1.6;
    }
    h1 { margin-bottom: .25rem; font-size: 1.5rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; font-size: .9rem; }
    .search-box {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .search-box input {
      width: 100%;
      padding: .75rem 1rem .75rem 2.5rem;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      transition: border-color .2s;
    }
    .search-box input:focus { border-color: #4a90d9; }
    .search-box::before {
      content: "\1F50D";
      position: absolute;
      left: .75rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: .5;
    }
    #status { color: #888; font-size: .85rem; margin-bottom: 1rem; min-height: 1.2em; }
    .result {
      padding: .75rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .result:last-child { border-bottom: none; }
    .result a {
      font-weight: 600;
      color: #1a5fa0;
      text-decoration: none;
      font-size: 1.05rem;
    }
    .result a:hover { text-decoration: underline; }
    .result .url { color: #2a7a2a; font-size: .8rem; margin-top: .1rem; }
    .result .excerpt {
      color: #444;
      font-size: .9rem;
      margin-top: .3rem;
    }
    .result .excerpt mark {
      background: #fff3cd;
      padding: 0 .1rem;
      border-radius: 2px;
    }
    .empty { color: #888; font-style: italic; padding: 1rem 0; }
  </style>
</head>
<body>
  <h1>pagefind-net search</h1>
  <p class="subtitle">Powered by a .NET-generated Pagefind index &mdash; 12 documents indexed at startup</p>

  <div class="search-box">
    <input id="query" type="search" placeholder="Try: install, ASP.NET, performance, deploy..." autofocus />
  </div>
  <div id="status"></div>
  <div id="results"></div>

  <script type="module">
    const pagefind = await import('./pagefind/pagefind.js');
    await pagefind.init();
    window.pagefind = pagefind;

    const input = document.getElementById('query');
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');
    let debounce = null;

    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(doSearch, 150);
    });

    async function doSearch() {
      const query = input.value.trim();
      if (!query) {
        resultsEl.innerHTML = '';
        statusEl.textContent = '';
        return;
      }

      const start = performance.now();
      const { results } = await pagefind.search(query);
      const elapsed = (performance.now() - start).toFixed(1);

      if (results.length === 0) {
        statusEl.textContent = `No results (${elapsed}ms)`;
        resultsEl.innerHTML = '<p class="empty">No matching documents found.</p>';
        return;
      }

      statusEl.textContent = `${results.length} result${results.length > 1 ? 's' : ''} (${elapsed}ms)`;

      const top = await Promise.all(results.slice(0, 10).map(r => r.data()));
      resultsEl.innerHTML = top.map(r => `
        <div class="result">
          <a href="${r.url}">${r.meta?.title ?? r.url}</a>
          <div class="url">${r.url}</div>
          <div class="excerpt">${r.excerpt ?? ''}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
